name: CI

# Pushing main auto-deploys Vercel production, so the gate CONTRIBUTING.md asks
# contributors to run by hand runs here instead. tsc is invoked separately from
# `next build` because it is faster and reports every file, not just the first
# failure the bundler trips over.
#
# NOTE: this workflow does not *block* the deploy — Vercel builds the same push
# in parallel. Making it a real gate needs branch protection plus a Vercel
# "Ignored Build Step"; see docs/DEV-SETUP.md.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match package.json "engines" — Vercel fails builds created on
          # or after 2026-10-01 for Node 20.
          node-version: 24
          cache: npm

      # `xlsx` resolves to vendor/xlsx-0.20.3.tgz (the registry package is
      # unmaintained). It used to be fetched from cdn.sheetjs.com, so this step
      # depended on a third party's uptime; the lockfile still carries the
      # original sha512, so the bytes are verified either way.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build-time only: NEXT_PUBLIC_* are inlined, and no CI step talks to
          # a real project. Never point these at production.
          NEXT_PUBLIC_DATA_BACKEND: mock

      # supabase/functions/* are Deno, excluded from tsconfig and from eslint,
      # so until now nothing checked them at all and the repo drifted from what
      # is deployed. `deno check` is the only tool that understands their
      # imports.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check edge functions
        run: deno task --config supabase/functions/deno.json check

      # Advisory, not a gate: the only known-vulnerable package left is the
      # postcss copy bundled inside next (build-time, trusted CSS input), which
      # no 15.x release fixes. Fails the step only on a NEW high/critical in a
      # runtime dependency.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
